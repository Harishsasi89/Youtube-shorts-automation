name: YouTube Shorts Automation

on:
  workflow_dispatch:

jobs:
  youtube-auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Create YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > token.json

      - name: Test YouTube authentication
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          with open("token.json", "r") as f:
              token_data = json.load(f)

          credentials = Credentials.from_authorized_user_info(
              token_data,
              ["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          response = youtube.channels().list(
              part="snippet",
              mine=True
          ).execute()

          channels = response.get("items", [])

          if not channels:
              raise RuntimeError("No YouTube channel was found.")

          channel = channels[0]["snippet"]

          print("================================")
          print("YOUTUBE AUTHENTICATION SUCCESS")
          print("================================")
          print("Channel:", channel["title"])
          print("GitHub can access your YouTube channel.")
          PY
