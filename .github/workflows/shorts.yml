name: YouTube Shorts Automation

on:
  workflow_dispatch:

  repository_dispatch:
    types: [new_video]

permissions:
  contents: write

jobs:
  youtube-auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Create YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > token.json

      - name: Create Google Drive credentials
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_DRIVE_SERVICE_ACCOUNT" > drive_service_account.json

      - name: Show trigger information
        run: |
          echo "================================"
          echo "SHORTS AUTOMATION TRIGGERED"
          echo "================================"
          echo "Event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Drive File ID: ${{ github.event.client_payload.file_id }}"
            echo "Drive File Name: ${{ github.event.client_payload.file_name }}"
          fi

      - name: Check duplicate
        id: duplicate_check
        if: github.event_name == 'repository_dispatch'
        env:
          DRIVE_FILE_ID: ${{ github.event.client_payload.file_id }}
        run: |
          python - <<'PY'
          import json
          import os

          file_id = os.environ["DRIVE_FILE_ID"]

          with open("processed_videos.json", "r") as f:
              data = json.load(f)

          processed = data.get("processed", [])

          print("Checking Drive file ID:", file_id)

          if file_id in processed:
              print("================================")
              print("DUPLICATE VIDEO")
              print("================================")
              print("This video has already been processed.")
              print("Skipping this video.")

              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("is_duplicate=true\n")
          else:
              print("================================")
              print("NEW VIDEO")
              print("================================")
              print("This video has not been processed yet.")

              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("is_duplicate=false\n")
          PY

      - name: Download video from Google Drive
        if: github.event_name == 'repository_dispatch' && steps.duplicate_check.outputs.is_duplicate != 'true'
        env:
          DRIVE_FILE_ID: ${{ github.event.client_payload.file_id }}
          DRIVE_FILE_NAME: ${{ github.event.client_payload.file_name }}
        run: |
          python - <<'PY'
          import json
          import os

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          file_id = os.environ["DRIVE_FILE_ID"]
          file_name = os.environ["DRIVE_FILE_NAME"]

          with open("drive_service_account.json", "r") as f:
              service_account_info = json.load(f)

          credentials = service_account.Credentials.from_service_account_info(
              service_account_info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )

          metadata = drive.files().get(
              fileId=file_id,
              fields="id,name,mimeType,size"
          ).execute()

          print("================================")
          print("GOOGLE DRIVE FILE")
          print("================================")
          print("Name:", metadata.get("name"))
          print("MIME type:", metadata.get("mimeType"))
          print("Size:", metadata.get("size"))

          safe_name = os.path.basename(file_name)

          request = drive.files().get_media(fileId=file_id)

          with open(safe_name, "wb") as output:
              downloader = MediaIoBaseDownload(
                  output,
                  request,
                  chunksize=10 * 1024 * 1024
              )

              done = False

              while not done:
                  status, done = downloader.next_chunk()

                  if status:
                      print(
                          f"Download progress: "
                          f"{int(status.progress() * 100)}%"
                      )

          downloaded_size = os.path.getsize(safe_name)

          print("================================")
          print("DOWNLOAD SUCCESSFUL")
          print("================================")
          print("Downloaded:", safe_name)
          print("Size:", downloaded_size, "bytes")

          if downloaded_size == 0:
              raise RuntimeError("Downloaded file is empty.")
          PY

      - name: Test YouTube upload authorization
        if: github.event_name != 'repository_dispatch' || steps.duplicate_check.outputs.is_duplicate != 'true'
        run: ||
          python - <<'PY'
          import json
          from google.oauth2.credentials import Credentials

          with open("token.json", "r") as f:
              token_data = json.load(f)

          credentials = Credentials.from_authorized_user_info(
              token_data
          )

          print("================================")
          print("YOUTUBE AUTHENTICATION SUCCESS")
          print("================================")
          print("Token loaded successfully.")
          print("Credentials valid:", credentials.valid)
          print("Has refresh token:", bool(credentials.refresh_token))

          upload_scope = "https://www.googleapis.com/auth/youtube.upload"

          if upload_scope not in (credentials.scopes or []):
              raise RuntimeError(
                  "YouTube upload permission is missing."
              )

          print("YouTube upload permission confirmed.")
          PY
      - name: Record processed video
        if: github.event_name == 'repository_dispatch' && success() && steps.duplicate_check.outputs.is_duplicate != 'true'
        env:
          DRIVE_FILE_ID: ${{ github.event.client_payload.file_id }}
        run: |
          python - <<'PY'
          import json
          import os

          file_id = os.environ["DRIVE_FILE_ID"]

          with open("processed_videos.json", "r") as f:
              data = json.load(f)

          processed = data.setdefault("processed", [])

          if file_id not in processed:
              processed.append(file_id)

          with open("processed_videos.json", "w") as f:
              json.dump(data, f, indent=2)

          print("Video recorded as processed.")
          PY

      - name: Commit processing record
        if: github.event_name == 'repository_dispatch' && success() && steps.duplicate_check.outputs.is_duplicate != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add processed_videos.json

          git diff --cached --quiet || \
            git commit -m "Record processed video"

          git push
